name: CI Test and Report to Xray

on:
  push:
    branches: [ version-4 ]
  pull_request:
    branches: [ version-4 ]

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Run Tests with Maven
      run: mvn verify -f api-spring-boot/pom.xml

    - name: Publish results to Xray
      if: always()
      run: |
        curl -H "Content-Type: multipart/form-data" \
        -H "Authorization: Bearer ${{ secrets.XRAY_TOKEN }}" \
        -F "file=@api-spring-boot/target/surefire-reports/TEST-*.xml" \
        "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=PROJ"
