services:
  postgres-etudiants:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: etudiantsdb
    ports:
      - "5433:5432"
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    restart: always

  etudiant-service:
    build:
      context: ./api-spring-boot
      dockerfile: Dockerfile
    depends_on:
      - postgres-etudiants
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-etudiants:5432/etudiantsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8081:8081"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
    ports:
      - "3000:3000"
    restart: always

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    restart: always

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/authdb
      JWT_SECRET: votre_secret_jwt_ici
    restart: always
